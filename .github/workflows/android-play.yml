name: Android Play Publish

# Publishes a signed release AAB to a Google Play track.
#
# Manual dispatch only. Deliberately has no push or tag trigger: a v* tag means
# "upload iOS to TestFlight" (see ios.yml), and nothing should reach Play without
# a human pressing the button.
#
# Why this builds the AAB itself instead of reusing the `release-aab` artifact
# from android.yml: a cross-workflow artifact fetch needs a third-party action or
# a workflow_run dance, and a stale artifact is a silent way to publish the wrong
# commit. Ten extra minutes buys provenance.
#
# Setup, permissions and troubleshooting: docs/guides/play-store-publishing.md

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release status ("draft" stages the AAB without releasing it)'
        required: true
        default: 'completed'
        type: choice
        options:
          - draft
          - completed

concurrency:
  group: android-play-${{ inputs.track }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish_play:
    name: Build signed AAB and publish to ${{ inputs.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scopes the run to the `play-test` environment so required-reviewer rules can
    # be attached to it later. The environment is created on first run.
    environment: play-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail in ten seconds instead of ten minutes: a missing Play credential or a
      # missing keystore are the two failure modes that look like Play API errors.
      - name: Preflight — credentials present
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          missing=0
          if [ -z "$PLAY_SA_JSON" ]; then
            echo "::error::secrets.PLAY_SERVICE_ACCOUNT_JSON is not set. See docs/guides/play-store-publishing.md"
            missing=1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secrets.KEYSTORE_BASE64 is not set: the build would fall back to debug signing and Play would reject the bundle."
            missing=1
          fi
          if [ -z "$STORE_PW" ] || [ -z "$KEY_PW" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_PASSWORD and KEYSTORE_KEY_ALIAS must all be set."
            missing=1
          fi
          exit "$missing"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: 'pub'

      - name: Configure Flutter JDK
        run: flutter config --jdk-dir="$JAVA_HOME"

      # --enforce-lockfile: a published build must match the committed lockfile,
      # even though android.yml resolves more loosely.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/metra-release.keystore

      - name: Write key.properties
        env:
          STORE_PW: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          {
            printf 'storePassword=%s\n' "$STORE_PW"
            printf 'keyPassword=%s\n'   "$KEY_PW"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'storeFile=metra-release.keystore\n'
          } > android/key.properties

      - name: Report version
        run: |
          echo "Artifact identity from android/app/build.gradle.kts:"
          grep -E 'versionCode|versionName' android/app/build.gradle.kts | sed 's/^[[:space:]]*//'

      - name: Build release bundle (AAB)
        run: >
          flutter build appbundle --release
          --dart-define=DROPBOX_APP_KEY=${{ secrets.DROPBOX_APP_KEY }}
          --dart-define=GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}

      - name: Rename release AAB
        run: |
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/com.paolosantucci.metraapp-release.aab

      # An unsigned or debug-signed AAB is rejected by Play with a confusing
      # certificate error after the upload. Catch it here instead. AAB is a JAR,
      # so jarsigner (not apksigner) is the right tool.
      - name: Verify AAB is signed
        run: |
          AAB=build/app/outputs/bundle/release/com.paolosantucci.metraapp-release.aab
          ls -l "$AAB"
          jarsigner -verify "$AAB" | tee /tmp/jarsigner.log
          grep -q 'jar verified' /tmp/jarsigner.log

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.paolosantucci.metraapp
          releaseFiles: build/app/outputs/bundle/release/com.paolosantucci.metraapp-release.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Summary
        run: |
          {
            echo "### Android → Google Play"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| track | \`${{ inputs.track }}\` |"
            echo "| status | \`${{ inputs.status }}\` |"
            echo "| package | \`com.paolosantucci.metraapp\` |"
            echo "| commit | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/app/metra-release.keystore android/key.properties
